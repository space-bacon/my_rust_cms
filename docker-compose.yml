# Docker Compose file for production environment

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: myrustcms_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-myrustcms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-my_rust_cms}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql
    networks:
      - myrustcms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myrustcms}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Frontend (Static Files served by Nginx)
  frontend:
    image: nginx:alpine
    container_name: myrustcms_frontend
    ports:
      - "8080:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - myrustcms-network
    restart: unless-stopped
    depends_on:
      - web

  # Rust CMS Backend Application
  web:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: myrustcms_web
    ports:
      - "8081:8081"
    env_file:
      - docker.env
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-myrustcms}:${POSTGRES_PASSWORD:-7Zxce7ag5PXFX3H1nmcmGZ9JGLeAvUg5}@postgres:5432/${POSTGRES_DB:-my_rust_cms}
      - RUST_LOG=${RUST_LOG:-info}
      - BACKEND_HOST=0.0.0.0
      - BACKEND_PORT=8081
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/uploads:/app/uploads
    networks:
      - myrustcms-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Development database management tool (optional)
  adminer:
    image: adminer:4.8.1
    container_name: myrustcms_adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    networks:
      - myrustcms-network
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
    driver: local

networks:
  myrustcms-network:
    driver: bridge